<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Route Offline</title>
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="googlebot" content="noindex, nofollow, noarchive, nosnippet">
  <meta name="bingbot" content="noindex, nofollow, noarchive, nosnippet">

  <!-- Google Fonts: Manrope (400, 500, 700, 800) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">

  <!-- Favicons & App Icons -->
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <meta name="theme-color" content="#0D1E3D">

  <link rel="stylesheet" href="./src/styles/main.css">
</head>
<body class="page-404">

  <!-- Minimal Nav for 404 -->
  <header class="site-nav scrolled" id="main-nav">
    <div class="nav-container">
      <a href="/" class="nav-brand" aria-label="APS — Process & Automation Systems">
        <img src="/assets/aps_logo_light.png" alt="APS — Process & Automation Systems" class="nav-logo" />
      </a>

      <div class="nav-actions">
        <a href="/" class="btn btn-outline" style="padding: 6px 16px; font-size: 13px;">
          <span>Return to Homepage</span>
        </a>
      </div>
    </div>
  </header>

  <!-- 404 Architectural Stage -->
  <main class="stage-404-wrapper" id="main-content">
    <div class="stage-404-card fade-up visible">
      
      <!-- Telemetry System Pill -->
      <div class="stage-404-telemetry">
        <span class="telemetry-pulse" aria-hidden="true" style="background-color: var(--aps-steel);"></span>
        <span>SYS_STATUS: 404 // ROUTE_DECOMMISSIONED</span>
      </div>

      <!-- Giant Architectural 404 Numeral -->
      <div class="numeral-404" aria-label="Error 404">404</div>

      <!-- Headline -->
      <h1 class="stage-404-title">This Route is Offline.<br>Commercial Services Suspended.</h1>

      <!-- Copy -->
      <p class="stage-404-desc">
        This route has been permanently decommissioned. Commercial procurement, catalog access, and online inquiries through this domain are not active.
      </p>

      <!-- Action Buttons -->
      <div class="stage-404-actions">
        <a href="/" class="btn btn-outline">
          <span>Return to Homepage</span>
        </a>
      </div>

    </div>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
